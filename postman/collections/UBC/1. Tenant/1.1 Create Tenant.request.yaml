$kind: http-request
name: 1.1 Register Tenant + Owner
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_name": "Tenant A",
        "email": "{{auth_email}}",
        "password": "password123",
        "full_name": "Owner UBC"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant, User, and Owner membership registered successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('tenant_id', body.tenant.id);
      pm.collectionVariables.set('tenant_version', body.tenant.version);
      pm.collectionVariables.set('auth_user_id', body.user.id);
      pm.collectionVariables.set('auth_email', body.user.email);
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('auth_email', `ubc_owner_${Math.random().toString(36).substring(2, 10)}@ubc.xyz`);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 1000
