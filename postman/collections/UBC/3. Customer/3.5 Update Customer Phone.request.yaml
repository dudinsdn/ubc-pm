$kind: http-request
url: "{{base_url}}/customers/{{customer_id}}/phone"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "089999999999",
      "expected_version": {{customer_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Update Customer Phone -> 200 OK', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.collectionVariables.set('customer_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 5000
