$kind: http-request
name: Delete Tenant - masih ada Business aktif -> 409
url: "{{base_url}}/tenants/{{tenant_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{tenant_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict (masih ada business aktif)', () => {
          pm.expect(pm.response.code).to.equal(409);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 6000
