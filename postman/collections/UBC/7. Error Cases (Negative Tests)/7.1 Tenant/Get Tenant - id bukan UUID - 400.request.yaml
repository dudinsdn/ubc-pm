$kind: http-request
name: Get Tenant - id bukan UUID -> 400
url: "{{base_url}}/tenants/bukan-uuid"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request (format id tidak valid)', () => {
          pm.expect(pm.response.code).to.equal(400);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2000
