$kind: http-request
name: Create Business - tenant tidak ada -> 404
url: "{{base_url}}/tenants/{{uuid_404}}/businesses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Business Hantu",
      "business_type": "retail"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found (tenant tidak ada)', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2000
