$kind: http-request
name: List Businesses - tenant tidak ada -> 404
url: "{{base_url}}/tenants/{{uuid_404}}/businesses"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found (tenant tidak ada)', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4000
