$kind: http-request
name: Create Transaction - amount negatif -> 400
url: "{{base_url}}/businesses/{{business_id}}/transactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "kind": "sale",
      "amount": -1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request (amount negatif)', () => {
          pm.expect(pm.response.code).to.equal(400);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4000
