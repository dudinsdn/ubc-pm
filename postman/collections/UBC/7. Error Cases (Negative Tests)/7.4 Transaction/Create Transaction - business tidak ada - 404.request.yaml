$kind: http-request
name: Create Transaction - business tidak ada -> 404
url: "{{base_url}}/businesses/{{uuid_404}}/transactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "kind": "sale",
      "amount": 10000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found (business tidak ada)', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 5000
