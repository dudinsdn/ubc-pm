$kind: http-request
url: "{{base_url}}/customers/{{customer_b_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{customer_b_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Delete Customer B -> 204 No Content', () => {
          pm.expect(pm.response.code).to.equal(204);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 6000
