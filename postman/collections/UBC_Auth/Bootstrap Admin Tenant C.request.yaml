$kind: http-request
name: Bootstrap Admin Tenant C
url: "{{base_url}}/users/{{admin_user_id}}/memberships/bootstrap-owner"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_c_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Admin menjadi Owner Tenant C', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.role).to.equal('owner');
      });
    language: text/javascript
order: 4503595900000000
