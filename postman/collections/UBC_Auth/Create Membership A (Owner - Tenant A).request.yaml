$kind: http-request
url: "{{base_url}}/users/{{user_id}}/memberships"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_id": "{{tenant_a_id}}",
        "role": "owner"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Membership Owner created successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('membership_a_id', body.id);
      pm.collectionVariables.set('membership_a_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503598902784766
