$kind: http-request
url: "{{base_url}}/tenants"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Tenant B for Membership B"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant B created successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('tenant_b_id', body.id);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503528977590311
