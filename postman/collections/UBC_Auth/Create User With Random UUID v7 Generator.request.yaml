$kind: http-request
name: Create User With Random UUID v7 Generator
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "id": "{{user_idemp_b_id}}",
        "email": "{{email_idemp_b}}",
        "password": "password123",
        "full_name": "User Idemp B"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('User created with generated UUID v7', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('user_idemp_b_id', body.id);
      pm.collectionVariables.set('user_idem_b_version', body.version);
    language: text/javascript
  - type: beforeRequest
    code: |-
      const random = Math.random().toString(36).substring(2, 10);
      pm.collectionVariables.set("email_idemp_b", `user_${random}@ubc.xyz`);
      pm.collectionVariables.set('user_idemp_b_id', uuidv7());

      function uuidv7() {
          const timestamp = Date.now();

          const bytes = new Uint8Array(16);

          // Random bytes menggunakan Math.random()
          for (let i = 0; i < 16; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
          }

          // 48-bit Unix timestamp milliseconds
          bytes[0] = Math.floor(timestamp / 2 ** 40) & 0xff;
          bytes[1] = Math.floor(timestamp / 2 ** 32) & 0xff;
          bytes[2] = Math.floor(timestamp / 2 ** 24) & 0xff;
          bytes[3] = Math.floor(timestamp / 2 ** 16) & 0xff;
          bytes[4] = Math.floor(timestamp / 2 ** 8) & 0xff;
          bytes[5] = timestamp & 0xff;

          // Version 7
          bytes[6] = (bytes[6] & 0x0f) | 0x70;

          // RFC 9562 variant
          bytes[8] = (bytes[8] & 0x3f) | 0x80;

          const hex = Array.from(bytes)
              .map(b => b.toString(16).padStart(2, '0'))
              .join('');

          return [
              hex.slice(0, 8),
              hex.slice(8, 12),
              hex.slice(12, 16),
              hex.slice(16, 20),
              hex.slice(20, 32)
          ].join('-');
      }
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4500753661910515
