$kind: http-request
name: Bootstrap Owner B
url: "{{base_url}}/users/{{owner_b_user_id}}/memberships/bootstrap-owner"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_b_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner pertama Tenant B created', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.role).to.equal('owner');
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_b_id'));
      });
    language: text/javascript
order: 4503540000000000
