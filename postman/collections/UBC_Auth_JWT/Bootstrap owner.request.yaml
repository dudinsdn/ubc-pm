$kind: http-request
name: Bootstrap owner
url: "{{base_url}}/users/{{user_id}}/memberships/bootstrap-owner"
method: POST
body:
  type: json
  content: |-
    {
    	"tenant_id": "{{tenant_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Status code is 201 Created', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.test('Membership pertama selalu Owner pada Tenant A', () => {
          pm.expect(body.user_id).to.equal(pm.collectionVariables.get('user_id'));
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_id'));
          pm.expect(body.role).to.equal('owner');
          pm.expect(body.version).to.equal(0);
      });
    language: text/javascript
order: 3736963358615630
