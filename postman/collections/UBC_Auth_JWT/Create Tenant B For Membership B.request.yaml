$kind: http-request
name: Register Tenant B + Owner B
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_name": "Tenant B for Membership B",
        "email": "{{owner_b_email}}",
        "password": "password123",
        "full_name": "Owner Tenant B"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant B created successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('tenant_b_id', body.tenant.id);
      pm.collectionVariables.set('owner_b_user_id', body.user.id);
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('owner_b_email', `owner_b_${Math.random().toString(36).substring(2, 10)}@ubc.xyz`);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503528977590311
