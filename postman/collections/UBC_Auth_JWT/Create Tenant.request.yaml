$kind: http-request
name: Register Tenant A + Owner
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_name": "Tenant A for Membership A",
        "email": "{{email}}",
        "password": "password123",
        "full_name": "User A"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant A and Owner registered successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('tenant_id', body.tenant.id);
      pm.collectionVariables.set('user_id', body.user.id);
      pm.collectionVariables.set('user_version', body.user.version);
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('email', `owner_a_${Math.random().toString(36).substring(2, 10)}@ubc.xyz`);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 1000158903104104
