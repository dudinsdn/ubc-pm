$kind: http-request
name: Create User
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{email}}",
        "password": "password123",
        "full_name": "User A"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('User created successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('user_id', body.id);
      pm.collectionVariables.set('user_version', body.version);
    language: text/javascript
  - type: beforeRequest
    code: |-
      const random = Math.random().toString(36).substring(2, 10);
      pm.collectionVariables.set("email", `${random}@ubc.xyz`);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 1509287659914791
