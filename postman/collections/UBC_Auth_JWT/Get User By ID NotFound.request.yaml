$kind: http-request
name: Get User By ID NotFound
url: "{{base_url}}/users/{{uuid_notfound}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('User ID NotFounded', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
      pm.test('Error code stabil', () => {
          pm.expect(body.error_code).to.equal('user_not_found');
      });
    language: text/javascript
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('uuid_notfound', uuidv7());

      function uuidv7() {
          const timestamp = Date.now();

          const bytes = new Uint8Array(16);

          // Random bytes menggunakan Math.random()
          for (let i = 0; i < 16; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
          }

          // 48-bit Unix timestamp milliseconds
          bytes[0] = Math.floor(timestamp / 2 ** 40) & 0xff;
          bytes[1] = Math.floor(timestamp / 2 ** 32) & 0xff;
          bytes[2] = Math.floor(timestamp / 2 ** 24) & 0xff;
          bytes[3] = Math.floor(timestamp / 2 ** 16) & 0xff;
          bytes[4] = Math.floor(timestamp / 2 ** 8) & 0xff;
          bytes[5] = timestamp & 0xff;

          // Version 7
          bytes[6] = (bytes[6] & 0x0f) | 0x70;

          // RFC 9562 variant
          bytes[8] = (bytes[8] & 0x3f) | 0x80;

          const hex = Array.from(bytes)
              .map(b => b.toString(16).padStart(2, '0'))
              .join('');

          return [
              hex.slice(0, 8),
              hex.slice(8, 12),
              hex.slice(12, 16),
              hex.slice(16, 20),
              hex.slice(20, 32)
          ].join('-');
      }
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4412292529156102
