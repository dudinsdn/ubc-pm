$kind: http-request
name: login
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
    	"tenant_id": "{{tenant_id}}",
    	"email": "{{email}}",
    	"password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Login successfully', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.test('Token di-scope ke Tenant A dan role Owner', () => {
          pm.expect(body.user_id).to.equal(pm.collectionVariables.get('user_id'));
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_id'));
          pm.expect(body.role).to.equal('owner');
          pm.expect(body.expires_at).to.be.a('string');
      });
      pm.collectionVariables.set('token', body.token);
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4291849531424813
