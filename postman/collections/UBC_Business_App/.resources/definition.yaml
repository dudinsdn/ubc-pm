$kind: collection
name: UBC_Business_App
description: |-
  Alur bisnis lengkap dan mandiri: register, login, Service Order,
  Transaction, Relationship, Interaction, Laundry Order, Auth/Membership,
  negative cases, offline retry/sync, dan cleanup berurutan.

  Collection melakukan onboarding publik lewat POST /register untuk membuat
  Tenant + User + Owner sekaligus. JWT hasil login serta seluruh ID dan version
  disimpan sebagai collection variables untuk request berikutnya.

  Fase offline mensimulasikan client-generated ID, replay antrean yang
  idempotent, dan incremental pull berdasarkan cursor RFC 3339. Local database
  dan sync queue tetap merupakan tanggung jawab client, bukan backend.

  Request Platform di awal hanya menyiapkan subscription dan aktivasi Tenant;
  request tersebut bukan coverage control plane collection ini.
variables:
  email: ""
  pwd: ""
  tenant_id: ""
  tenant_version: ""
  user_id: ""
  membership_id: ""
  token: ""
  user_version: ""
  membership_version: ""
  other_email: ""
  other_pwd: ""
  other_tenant_id: ""
  other_tenant_version: ""
  other_user_id: ""
  other_membership_id: ""
  base_url: ""
auth:
  type: noauth
