$kind: collection
name: UBC Business App
description: |-
  Suite negative mandiri untuk DTO Business App. Seluruh request memverifikasi
  invalid input, invalid credentials, missing Tenant JWT, atau security error
  tanpa membuat fixture dan tanpa memanggil endpoint Platform/Customer.

  Happy path dan negative integration yang membutuhkan state tetap berada di
  UBC_Integration_Runner sampai fixture seeder tersedia.
