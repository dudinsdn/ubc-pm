$kind: http-request
name: 17 Offline Incremental Sync Tenants
url: "{{base_url}}/tenants?updated_since={{offline_sync_cursor}}"
method: GET
queryParams:
  - key: updated_since
    value: "{{offline_sync_cursor}}"
    disabled: false
    description: RFC 3339, contoh 2026-08-01T00:00:00Z
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Offline sync Tenants -> 200 and includes changed resource', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.some(item => item.id === pm.collectionVariables.get('tenant_id'))).to.be.true;
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 17000
