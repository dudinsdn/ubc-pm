$kind: http-request
name: Staff Tidak Dapat Mengubah Tenant
url: "{{base_url}}/tenants/{{tenant_b_id}}"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{token_staff_b}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Tidak boleh diubah Staff",
      "expected_version": {{tenant_b_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Staff rename Tenant ditolak', () => {
          pm.expect(pm.response.code).to.equal(403);
          pm.expect(body.error_code).to.equal('forbidden');
      });
    language: text/javascript
order: 4503581000000000
