$kind: http-request
name: L04 Incremental Sync Laundry Orders
url: "{{base_url}}/businesses/{{laundry_business_id}}/laundry-orders?updated_since={{laundry_sync_cursor}}"
method: GET
queryParams:
  - key: updated_since
    value: "{{laundry_sync_cursor}}"
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Laundry incremental sync includes created order', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.some(item => item.id === pm.collectionVariables.get('laundry_order_id'))).to.be.true;
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23040
