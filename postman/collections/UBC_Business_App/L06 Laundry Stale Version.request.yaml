$kind: http-request
name: L06 Replace Laundry Lines With Stale Version -> 409
url: "{{base_url}}/laundry-orders/{{laundry_order_id}}/lines"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{err_version}},
      "lines": [
        {
          "service_code": "wash_fold",
          "pricing_unit": "kilogram",
          "quantity_milli_units": 1000,
          "unit_price": 10000
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Laundry stale version -> 409 Conflict', () => {
          pm.expect(pm.response.code).to.equal(409);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23060
