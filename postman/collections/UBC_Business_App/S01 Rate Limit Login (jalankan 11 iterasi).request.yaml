$kind: http-request
name: Security Rate Limit Login (11 Iterasi)
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_a_id}}",
      "email": "{{email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const expected = pm.info.iteration < 20 ? 200 : 429;
      pm.test('Rate limit login sesuai iterasi runner', () => {
          pm.expect(pm.response.code).to.equal(expected);
      });
      if (pm.info.iteration >= 10) {
          const body = pm.response.json();
          pm.expect(body.error_code).to.equal('rate_limit_exceeded');
          pm.expect(pm.response.headers.get('Retry-After')).to.equal('60');
      }
    language: text/javascript
order: 4503999000000000
