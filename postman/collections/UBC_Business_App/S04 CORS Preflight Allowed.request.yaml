$kind: http-request
name: Security CORS Preflight Origin Diizinkan
url: "{{base_url}}/auth/login"
method: OPTIONS
headers:
  Origin: "{{cors_allowed_origin}}"
  Access-Control-Request-Method: POST
  Access-Control-Request-Headers: authorization, content-type
scripts:
  - type: afterResponse
    code: |-
      pm.test('Preflight CORS origin terdaftar diizinkan', () => {
          pm.expect(pm.response.code).to.equal(204);
          pm.expect(pm.response.headers.get('Access-Control-Allow-Origin')).to.equal(pm.variables.get('cors_allowed_origin'));
      });
    language: text/javascript
order: 4503993000000000
