$kind: http-request
name: A01_Register_Tenant_and_Owner
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
    	"tenant_name": "Tenant A",
    	"email": "{{email}}",
    	"password": "{{pwd}}",
    	"full_name": "Owner Tenant A"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant and Owner registered successfully', () => {
      	pm.expect(pm.response.code).to.equal(201);
      	pm.expect(body.tenant.status).to.equal('pending');
      	pm.collectionVariables.set('tenant_id', body.tenant.id);
      	pm.collectionVariables.set('tenant_version', body.tenant.version);
      	pm.collectionVariables.set('user_id', body.user.id);
      	pm.collectionVariables.set('membership_id', body.membership.id);
      });
    language: text/javascript
  - type: beforeRequest
    code: |-
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      pm.collectionVariables.set('email', `owner${randomNum}@tenant.xyz`);
      pm.collectionVariables.set('pwd', 'pwd12345678')
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 1000
