$kind: http-request
url: "{{base_url}}/users/{{user_id}}/rename"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "User A Edit",
      "expected_version": {{user_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('User renamed successfully', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.collectionVariables.set('user_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4441417933206526
