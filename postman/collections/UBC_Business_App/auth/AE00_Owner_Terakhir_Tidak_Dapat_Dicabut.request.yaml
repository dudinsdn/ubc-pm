$kind: http-request
name: AE00_Owner_Terakhir_Tidak_Dapat_Dicabut
url: "{{base_url}}/memberships/{{membership_id}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": 0
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner terakhir tidak dapat dicabut', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error_code).to.equal('last_owner_required');
      });
    language: text/javascript
order: 5000
