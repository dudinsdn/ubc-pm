$kind: http-request
name: AE01_Register_Another_Tenant_and_Owner
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
    	"tenant_name": "Other Tenant",
    	"email": "{{other_email}}",
    	"password": "{{other_pwd}}",
    	"full_name": "Other Owner Tenant"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant and Owner registered successfully', () => {
      	pm.expect(pm.response.code).to.equal(201);
      	pm.expect(body.tenant.status).to.equal('pending');
      });
      pm.collectionVariables.set('other_tenant_id', body.tenant.id);
      pm.collectionVariables.set('other_tenant_version', body.tenant.version);
      pm.collectionVariables.set('other_user_id', body.user.id);
      pm.collectionVariables.set('other_membership_id', body.membership.id);
    language: text/javascript
  - type: beforeRequest
    code: |-
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      pm.collectionVariables.set('other_email', `other_owner${randomNum}@tenant.xyz`);
      pm.collectionVariables.set('other_pwd', 'pwd12345678')
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 7000
