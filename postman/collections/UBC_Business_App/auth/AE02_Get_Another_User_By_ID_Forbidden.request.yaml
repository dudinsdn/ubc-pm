$kind: http-request
name: AE02_Get_Another_User_By_ID_Forbidden
url: "{{base_url}}/users/{{other_user_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('User lain tidak boleh dibaca', () => {
          pm.expect(pm.response.code).to.equal(403);
      });
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 8000
