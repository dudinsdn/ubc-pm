$kind: http-request
name: Login Invalid Credentials
url: "{{base_url}}/auth/login"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"tenant_id":"00000000-0000-4000-8000-000000000001","email":"missing@example.com","password":"wrong-password"}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Invalid Business credentials return 401', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('invalid_credentials');
      });
    language: text/javascript
order: 2000
