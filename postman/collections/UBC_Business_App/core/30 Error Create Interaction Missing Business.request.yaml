$kind: http-request
name: 30 Error - Create Interaction with Missing Business -> 404
url: "{{base_url}}/businesses/{{uuid_404}}/interactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer_id": "{{customer_id}}",
      "interaction_type": "call"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found (business tidak ada)', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 30000
