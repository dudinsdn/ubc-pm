$kind: http-request
name: 1.5 Register With Same IDs is Idempotent
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_id": "{{tenant_id}}",
        "tenant_name": "UBC End-to-End Tenant",
        "user_id": "{{auth_user_id}}",
        "email": "{{auth_email}}",
        "password": "password123",
        "full_name": "Workshop Collection Owner",
        "membership_id": "{{auth_membership_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Registration retry returns the same resources', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.tenant.id).to.equal(pm.collectionVariables.get('tenant_id'));
          pm.expect(body.user.id).to.equal(pm.collectionVariables.get('auth_user_id'));
          pm.expect(body.membership.id).to.equal(pm.collectionVariables.get('auth_membership_id'));
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2600
