$kind: http-request
name: Register - nama tenant kosong -> 400
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_name": "   ",
      "email": "{{auth_email}}",
      "password": "password123",
      "full_name": "Workshop Collection Owner"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('400 Bad Request + pesan nama tenant kosong', () => {
          pm.expect(pm.response.code).to.equal(400);
          pm.expect(body.error).to.include('kosong');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33100
