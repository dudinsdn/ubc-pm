$kind: http-request
name: Core Missing Token
url: "{{base_url}}/tenants"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Core rejects missing Tenant JWT', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('missing_token');
      });
    language: text/javascript
order: 3000
