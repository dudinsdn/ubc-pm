$kind: http-request
name: L00C Create Laundry Transaction
url: "{{base_url}}/businesses/{{laundry_business_id}}/transactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{laundry_transaction_id}}",
      "customer_id": "{{laundry_customer_id}}",
      "kind": "sale",
      "amount": 50000,
      "occurred_at": "{{offline_occurred_at}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('laundry_transaction_id', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Create matching Laundry Transaction -> 201', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.business_id).to.equal(pm.collectionVariables.get('laundry_business_id'));
          pm.expect(body.customer_id).to.equal(pm.collectionVariables.get('laundry_customer_id'));
          pm.expect(body.amount).to.equal(50000);
      });
      if (pm.response.code === 201) {
          pm.collectionVariables.set('laundry_transaction_version', body.version);
      }
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23003
