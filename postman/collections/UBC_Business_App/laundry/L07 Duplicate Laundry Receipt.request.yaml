$kind: http-request
name: L07 Duplicate Laundry Receipt -> 409
url: "{{base_url}}/businesses/{{laundry_business_id}}/laundry-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer_id": "{{laundry_customer_id}}",
      "receipt_number": "{{laundry_receipt_number}}",
      "lines": [
        {
          "service_code": "wash_fold",
          "pricing_unit": "kilogram",
          "quantity_milli_units": 1000,
          "unit_price": 10000
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Duplicate Laundry receipt in one Business -> 409', () => {
          pm.expect(pm.response.code).to.equal(409);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23070
