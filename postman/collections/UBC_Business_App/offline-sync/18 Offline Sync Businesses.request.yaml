$kind: http-request
name: 18 Offline Incremental Sync Businesses
url: "{{base_url}}/tenants/{{tenant_id}}/businesses?cursor={{offline_sync_cursor}}"
method: GET
queryParams:
  - key: cursor
    value: "{{offline_sync_cursor}}"
    disabled: false
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Offline sync Businesses -> 200 and includes changed resource', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.items.some(item => item.id === pm.collectionVariables.get('business_id'))).to.be.true;
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 18000
