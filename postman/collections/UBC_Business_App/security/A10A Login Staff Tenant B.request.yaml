$kind: http-request
name: Login Staff Tenant B untuk Revocation
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_b_id}}",
      "email": "{{email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Login Staff Tenant B berhasil', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.user_id).to.equal(pm.collectionVariables.get('user_id'));
          pm.expect(body.role).to.equal('staff');
      });
      pm.collectionVariables.set('token_staff_b', body.token);
    language: text/javascript
order: 4503575000000000
