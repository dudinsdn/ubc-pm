$kind: http-request
name: Token Lama Ditolak Setelah Role Berubah
url: "{{base_url}}/users/{{user_id}}/memberships"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token_staff_b}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Token lama ditolak setelah role berubah', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('access_revoked');
      });
    language: text/javascript
order: 4503591000000000
