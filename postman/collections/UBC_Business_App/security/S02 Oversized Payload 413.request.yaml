$kind: http-request
name: Security Payload Lebih dari 1 MiB
url: "{{base_url}}/tenants/{{tenant_b_id}}/businesses"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_b}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{oversized_payload}}",
      "business_type": "retail"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set('oversized_payload', 'x'.repeat(1048576));
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Payload besar ditolak', () => {
          pm.expect(pm.response.code).to.equal(413);
          pm.expect(body.error_code).to.equal('payload_too_large');
      });
    language: text/javascript
order: 4503991000000000
