$kind: http-request
name: Workshop Missing Token
url: "{{base_url}}/businesses/00000000-0000-4000-8000-000000000001/service-orders"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Workshop rejects missing Tenant JWT', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('missing_token');
      });
    language: text/javascript
order: 4000
