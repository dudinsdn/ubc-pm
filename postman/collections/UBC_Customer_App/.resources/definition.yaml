$kind: collection
name: UBC Customer App
description: |-
  Collection Customer App online-first: identity linking, invitation lifecycle,
  claim single-use, portal login, token isolation, profil tertaut, dan transaksi
  Customer read-only. Register, aktivasi Tenant, dan mutation Business/Customer
  hanya menjadi setup fixture bagi boundary Customer App.

  Gunakan environment UBC Local dan isi local value untuk
  platform_admin_token, platform_operator_email, dan
  platform_operator_password. Collection tidak menyimpan secret.
auth:
  type: bearer
  credentials:
    token: "{{tenant_access_token}}"
variables:
  tenant_access_token: ""
  platform_access_token: ""
  portal_access_token: ""
  owner_email: ""
  portal_email: ""
  tenant_id: ""
  tenant_version: ""
  business_id: ""
  customer_id: ""
  transaction_id: ""
  invitation_id: ""
  invitation_claim_token: ""
  auth_user_id: ""
  auth_email: ""
  customer_b_id: ""
  customer_b_version: ""
  portal_identity_link_id: ""
  portal_invitation_id: ""
  portal_invitation_version: ""
  portal_invitation_claim_token: ""
  portal_revoked_claim_token: ""
  portal_invitee_email: ""
  invited_portal_access_token: ""
  token_other_tenant: ""
  other_tenant_id: ""
  other_tenant_version: ""
  other_owner_email: ""
  other_owner_user_id: ""
scripts:
  - type: http:beforeRequest
    code: |-
      if (!pm.collectionVariables.get('owner_email')) {
        const suffix = Date.now() + '_' + Math.random().toString(36).slice(2, 9);
        pm.collectionVariables.set('owner_email', 'n2n_owner_' + suffix + '@example.com');
        pm.collectionVariables.set('portal_email', 'n2n_customer_' + suffix + '@example.com');
      }
    language: text/javascript
