$kind: http-request
name: 01 Login Platform Operator
url: "{{base_url}}/platform/auth/login"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{platform_operator_email}}",
      "password": "{{platform_operator_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform login berhasil', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('platform_access_token', body.token);
    language: text/javascript
order: 200

