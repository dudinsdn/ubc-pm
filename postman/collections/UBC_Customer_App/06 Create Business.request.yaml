$kind: http-request
name: 06 Create Business
url: "{{base_url}}/tenants/{{tenant_id}}/businesses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "UBC N2N Laundry",
      "business_type": "laundry"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Business dibuat oleh Tenant aktif', () => {
        pm.expect(pm.response.code).to.equal(201);
        pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_id'));
      });
      pm.collectionVariables.set('business_id', body.id);
    language: text/javascript
order: 700

