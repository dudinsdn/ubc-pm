$kind: http-request
name: CP06 Tenant Token Rejected By Portal
url: "{{base_url}}/customer-portal/profiles"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('JWT Tenant tidak diterima perimeter Customer Portal', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('portal_token_invalid');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33362
