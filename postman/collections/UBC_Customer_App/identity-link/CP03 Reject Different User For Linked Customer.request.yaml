$kind: http-request
name: CP03 Reject Different User For Linked Customer
url: "{{base_url}}/businesses/{{business_id}}/customers/{{customer_id}}/portal-identity"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "user_id": "{{other_owner_user_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Customer tidak dapat ditautkan ke User kedua', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error_code).to.equal('customer_already_linked');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33330
