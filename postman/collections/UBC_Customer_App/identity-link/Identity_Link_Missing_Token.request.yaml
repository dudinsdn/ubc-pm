$kind: http-request
name: Identity Link Missing Tenant Token
url: "{{base_url}}/businesses/00000000-0000-4000-8000-000000000001/customers/00000000-0000-4000-8000-000000000002/portal-identity"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"user_id":"00000000-0000-4000-8000-000000000003"}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Identity linking rejects missing Tenant JWT', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('missing_token');
      });
    language: text/javascript
order: 1000
