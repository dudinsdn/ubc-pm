$kind: http-request
name: CPI05 Claim Invitation As New User
url: "{{base_url}}/customer-portal/invitations/claim"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{portal_invitation_claim_token}}",
      "password": "password123",
      "full_name": "Invited Customer"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Claim atomik membuat User, link, dan JWT portal', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.user_id).to.be.a('string').and.not.empty;
          pm.expect(body.token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('invited_portal_access_token', body.token);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33333
