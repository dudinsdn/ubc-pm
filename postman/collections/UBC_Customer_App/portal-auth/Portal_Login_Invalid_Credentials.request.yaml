$kind: http-request
name: Portal Login Invalid Credentials
url: "{{base_url}}/customer-portal/auth/login"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email":"missing-portal@example.com","password":"wrong-password"}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Invalid Portal credentials return 401', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('portal_invalid_credentials');
      });
    language: text/javascript
order: 3000
