$kind: http-request
name: Portal Profiles Missing Token
url: "{{base_url}}/customer-portal/profiles"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Portal read rejects missing Portal JWT', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('portal_token_missing');
      });
    language: text/javascript
order: 5000
