$kind: collection
name: UBC End-to-End Business Flow
description: |-
  Alur bisnis lengkap dan mandiri: register, login, Service Order,
  Transaction, Relationship, Interaction, dan Laundry Order.

  Collection melakukan onboarding publik lewat POST /register untuk membuat
  Tenant + User + Owner sekaligus. JWT hasil login serta seluruh ID dan version
  disimpan sebagai collection variables untuk request berikutnya.

  Fase offline mensimulasikan client-generated ID, replay antrean yang
  idempotent, dan incremental pull berdasarkan cursor RFC 3339. Local database
  dan sync queue tetap merupakan tanggung jawab client, bukan backend.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
variables:
  base_url: http://localhost:3000
  token: ""
  token_other_tenant: ""
  token_b: ""
  token_c: ""
  auth_email: ""
