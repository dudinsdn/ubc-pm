$kind: http-request
name: 03 Create Business
url: "{{base_url}}/tenants/{{tenant_id}}/businesses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Bengkel",
      "business_type": "workshop"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Create Business -> 201 Created', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('business_id', body.id);
      pm.collectionVariables.set('business_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 3000
