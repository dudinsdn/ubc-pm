$kind: http-request
name: 08 Complete Service Order with Transaction
url: "{{base_url}}/service-orders/{{service_order_id}}/complete"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{service_order_version}},
      "transaction_id": "{{transaction_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Complete ServiceOrder -> 200 OK, status completed', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.collectionVariables.set('service_order_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 8000
