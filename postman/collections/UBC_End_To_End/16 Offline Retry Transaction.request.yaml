$kind: http-request
name: 16 Offline Retry Transaction with Same Client ID
url: "{{base_url}}/businesses/{{business_id}}/transactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{offline_transaction_id}}",
      "customer_id": "{{customer_id}}",
      "kind": "sale",
      "amount": 50000,
      "occurred_at": "{{offline_occurred_at}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Offline retry is idempotent -> 200 OK', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.collectionVariables.set('transaction_id', body.id);
      pm.collectionVariables.set('transaction_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 16000
