$kind: http-request
name: 24 Error - Get Missing Tenant -> 404
url: "{{base_url}}/tenants/{{uuid_404}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 24000
