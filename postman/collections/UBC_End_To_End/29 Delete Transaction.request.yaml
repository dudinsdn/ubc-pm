$kind: http-request
name: 29 Delete Transaction
url: "{{base_url}}/transactions/{{transaction_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{transaction_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Delete Transaction -> 204 No Content', () => {
          pm.expect(pm.response.code).to.equal(204);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 29000
