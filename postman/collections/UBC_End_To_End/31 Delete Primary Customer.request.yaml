$kind: http-request
name: 31 Delete Primary Customer
url: "{{base_url}}/customers/{{customer_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{customer_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Delete Customer -> 204 No Content', () => {
          pm.expect(pm.response.code).to.equal(204);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 31000
