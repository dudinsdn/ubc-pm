$kind: http-request
name: 32 Delete Business
url: "{{base_url}}/businesses/{{business_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{business_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Delete Business -> 204 No Content', () => {
          pm.expect(pm.response.code).to.equal(204);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 32000
