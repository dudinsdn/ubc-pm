$kind: http-request
name: 33 Error - Create Customer with Invalid Phone -> 400
url: "{{base_url}}/businesses/{{business_id}}/customers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Customer Invalid Phone",
      "phone": "abc"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request (phone invalid)', () => {
          pm.expect(pm.response.code).to.equal(400);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33000
