$kind: http-request
name: 1.1c Login Owner
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_id}}",
      "email": "{{auth_email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner login returns Tenant-scoped JWT', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.user_id).to.equal(pm.collectionVariables.get('auth_user_id'));
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_id'));
          pm.expect(body.role).to.equal('owner');
          pm.expect(body.token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('token', body.token);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 1300
