$kind: http-request
name: 1.3 List Tenants (incremental sync)
url: "{{base_url}}/tenants?updated_since=2026-08-01T00:00:00Z"
method: GET
queryParams:
  - key: updated_since
    value: 2026-08-01T00:00:00Z
    disabled: false
    description: RFC 3339, contoh 2026-08-01T00:00:00Z
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 3000
