$kind: http-request
name: 1.8 Login Tenant UUID7
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_uuid7_generator}}",
      "email": "{{uuid7_owner_email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('JWT khusus Tenant UUID7 berhasil dibuat', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_uuid7_generator'));
          pm.expect(body.role).to.equal('owner');
      });
      pm.collectionVariables.set('token_uuid7_tenant', body.token);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 3400000000000000
