$kind: http-request
name: Create Tenant - nama kosong -> 400
url: "{{base_url}}/tenants"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "   "
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('400 Bad Request + pesan nama kosong', () => {
          pm.expect(pm.response.code).to.equal(400);
          pm.expect(body.error).to.include('kosong');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 1000
