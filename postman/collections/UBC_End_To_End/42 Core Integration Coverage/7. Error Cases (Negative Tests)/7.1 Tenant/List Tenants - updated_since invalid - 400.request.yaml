$kind: http-request
name: List Tenants - updated_since invalid -> 400
url: "{{base_url}}/tenants?updated_since=bukan-tanggal"
method: GET
queryParams:
  updated_since: bukan-tanggal
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('400 Bad Request (RFC 3339)', () => {
          pm.expect(pm.response.code).to.equal(400);
          pm.expect(body.error).to.include('RFC 3339');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 5000
