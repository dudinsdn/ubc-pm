$kind: http-request
name: Create Interaction - jenis kosong -> 400
url: "{{base_url}}/businesses/{{business_id}}/interactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer_id": "{{customer_id}}",
      "interaction_type": "   "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request (jenis kosong)', () => {
          pm.expect(pm.response.code).to.equal(400);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2000
