$kind: http-request
url: "{{base_url}}/businesses/{{business_id}}/service-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer_id": "{{customer_id}}",
      "description": "Servis yang akan dibatalkan"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Create ServiceOrder (cancel demo) -> 201 Created', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('service_order_cancel_id', body.id);
      pm.collectionVariables.set('service_order_cancel_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503418074395579
