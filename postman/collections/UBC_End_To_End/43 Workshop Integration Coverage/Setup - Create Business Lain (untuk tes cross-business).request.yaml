$kind: http-request
url: "{{base_url}}/tenants/{{other_tenant_id}}/businesses"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_other_tenant}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Bengkel Lain",
      "business_type": "workshop"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('other_business_id', body.id);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503599155186315
