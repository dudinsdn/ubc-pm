$kind: http-request
name: CP10 Reject Unlinked Portal Profile
url: "{{base_url}}/customer-portal/profiles/{{customer_b_id}}/transactions"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{portal_access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Customer lain disembunyikan sebagai 404', () => {
          pm.expect(pm.response.code).to.equal(404);
          pm.expect(body.error_code).to.equal('customer_profile_not_found');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33356
