$kind: http-request
name: CP11 Deleted Transaction Hidden From Portal
url: "{{base_url}}/customer-portal/profiles/{{customer_id}}/transactions"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{portal_access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Transaksi soft-delete tidak terlihat di portal', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body).to.be.an('array').that.is.empty;
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 37100
