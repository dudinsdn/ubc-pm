$kind: http-request
name: CPI07 Invited User Reads Linked Profile
url: "{{base_url}}/customer-portal/profiles"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{invited_portal_access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('User hasil claim hanya membaca Customer yang diundang', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body).to.be.an('array').with.lengthOf(1);
          pm.expect(body[0].customer_id).to.equal(pm.collectionVariables.get('customer_b_id'));
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33335
