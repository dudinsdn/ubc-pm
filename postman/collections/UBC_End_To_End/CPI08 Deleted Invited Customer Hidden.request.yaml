$kind: http-request
name: CPI08 Deleted Invited Customer Hidden
url: "{{base_url}}/customer-portal/profiles"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{invited_portal_access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Customer hasil invitation tersembunyi setelah soft-delete', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body).to.be.an('array').that.is.empty;
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 38100
