$kind: http-request
name: L03 Get Laundry Order
url: "{{base_url}}/laundry-orders/{{laundry_order_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Get Laundry Order -> 200', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.id).to.equal(pm.collectionVariables.get('laundry_order_id'));
          pm.expect(body.lines).to.have.length(2);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23030
