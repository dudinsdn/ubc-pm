$kind: http-request
name: L05 Replace Laundry Order Lines
url: "{{base_url}}/laundry-orders/{{laundry_order_id}}/lines"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{laundry_order_version}},
      "lines": [
        {
          "service_code": "wash_fold",
          "pricing_unit": "kilogram",
          "quantity_milli_units": 3000,
          "unit_price": 12000
        },
        {
          "service_code": "dry_clean",
          "pricing_unit": "piece",
          "quantity_milli_units": 2000,
          "unit_price": 7000
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Replace Laundry lines -> 200 and recalculated total', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.status).to.equal('received');
          pm.expect(body.total).to.equal(50000);
      });
      if (pm.response.code === 200) {
          pm.collectionVariables.set('laundry_order_version', body.version);
      }
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23050
