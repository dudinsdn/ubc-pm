$kind: http-request
name: L12 Cancel Laundry Order
url: "{{base_url}}/laundry-orders/{{laundry_cancel_order_id}}/cancel"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{laundry_cancel_order_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Cancel Laundry Order -> cancelled', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.status).to.equal('cancelled');
      });
      if (pm.response.code === 200) {
          pm.collectionVariables.set('laundry_cancel_order_version', body.version);
      }
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23120
