$kind: http-request
name: L13 Fractional Piece Laundry Quantity -> 400
url: "{{base_url}}/businesses/{{laundry_business_id}}/laundry-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer_id": "{{laundry_customer_id}}",
      "receipt_number": "{{laundry_invalid_receipt_number}}",
      "lines": [
        {
          "service_code": "dry_clean",
          "pricing_unit": "piece",
          "quantity_milli_units": 1500,
          "unit_price": 7500
        }
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set(
        'laundry_invalid_receipt_number',
        `INVALID-${pm.variables.replaceIn('{{$guid}}')}`
      );
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Fractional piece quantity -> 400 Bad Request', () => {
          pm.expect(pm.response.code).to.equal(400);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23130
