$kind: http-request
name: P01 Pending Tenant Cannot Access Core
url: "{{base_url}}/tenants/{{tenant_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Pending Tenant ditolak sebelum aktivasi', () => {
          pm.expect(pm.response.code).to.equal(403);
          pm.expect(body.error_code).to.equal('tenant_pending');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2010
