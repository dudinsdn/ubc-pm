$kind: http-request
name: P02 Platform List Tenants
url: "{{base_url}}/platform/tenants"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform Admin melihat Tenant pending', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body).to.be.an('array');
          const tenant = body.find(item => item.id === pm.collectionVariables.get('tenant_id'));
          pm.expect(tenant).to.be.an('object');
          pm.expect(tenant.status).to.equal('pending');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2020
