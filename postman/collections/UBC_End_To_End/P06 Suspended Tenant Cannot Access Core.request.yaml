$kind: http-request
name: P06 Suspended Tenant Cannot Access Core
url: "{{base_url}}/tenants/{{tenant_id}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Suspended Tenant ditolak oleh activation gate', () => {
          pm.expect(pm.response.code).to.equal(403);
          pm.expect(body.error_code).to.equal('tenant_suspended');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33350
