$kind: http-request
name: P07 Platform Reactivate Tenant
url: "{{base_url}}/platform/tenants/{{tenant_id}}/status"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "expected_version": {{tenant_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform Admin mengaktifkan kembali Tenant', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.status).to.equal('active');
      });
      pm.collectionVariables.set('tenant_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33360
