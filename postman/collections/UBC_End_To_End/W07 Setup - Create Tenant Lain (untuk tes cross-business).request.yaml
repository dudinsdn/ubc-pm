$kind: http-request
name: Setup - Register Tenant Lain + Owner
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_name": "Tenant Bengkel Lain",
      "email": "{{other_owner_email}}",
      "password": "password123",
      "full_name": "Owner Bengkel Lain"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('other_tenant_id', body.tenant.id);
      pm.collectionVariables.set('other_owner_user_id', body.user.id);
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('other_owner_email', `workshop_other_${Math.random().toString(36).substring(2, 10)}@ubc.xyz`);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23450
