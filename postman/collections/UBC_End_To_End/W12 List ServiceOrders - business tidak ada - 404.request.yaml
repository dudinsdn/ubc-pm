$kind: http-request
name: List ServiceOrders - business tidak ada -> 404
url: "{{base_url}}/businesses/{{uuid_404}}/service-orders"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found (business tidak ada)', () => {
          pm.expect(pm.response.code).to.equal(404);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33250
