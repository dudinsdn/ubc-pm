$kind: http-request
name: P04B Suspended Tenant Cannot Access Core
url: "{{base_url}}/tenants/{{tenant_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant suspended ditolak oleh Business perimeter', () => {
          pm.expect(pm.response.code).to.equal(403);
          pm.expect(body.error_code).to.equal('tenant_suspended');
      });
    language: text/javascript
order: 2044
