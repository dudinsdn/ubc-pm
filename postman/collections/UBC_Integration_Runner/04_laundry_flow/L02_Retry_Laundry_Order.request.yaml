$kind: http-request
name: L02 Retry Laundry Order Is Idempotent
url: "{{base_url}}/businesses/{{laundry_business_id}}/laundry-orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{laundry_order_id}}",
      "customer_id": "{{laundry_customer_id}}",
      "receipt_number": "{{laundry_receipt_number}}",
      "lines": [
        {
          "service_code": "wash_fold",
          "pricing_unit": "kilogram",
          "quantity_milli_units": 2500,
          "unit_price": 10000
        },
        {
          "service_code": "dry_clean",
          "pricing_unit": "piece",
          "quantity_milli_units": 2000,
          "unit_price": 7500
        }
      ],
      "note": "Laundry order dari UBC_End_To_End"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Laundry create retry -> 200 and same aggregate', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.id).to.equal(pm.collectionVariables.get('laundry_order_id'));
          pm.expect(body.version).to.equal(Number(pm.collectionVariables.get('laundry_order_version')));
          pm.expect(body.total).to.equal(40000);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23020
