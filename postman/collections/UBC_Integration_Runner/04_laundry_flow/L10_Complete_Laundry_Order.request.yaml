$kind: http-request
name: L10 Complete Laundry Order With Transaction
url: "{{base_url}}/laundry-orders/{{laundry_order_id}}/complete"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{laundry_order_version}},
      "transaction_id": "{{laundry_transaction_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Complete Laundry Order links matching Core Transaction', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.status).to.equal('completed');
          pm.expect(body.transaction_id).to.equal(pm.collectionVariables.get('laundry_transaction_id'));
          pm.expect(body.total).to.equal(50000);
      });
      if (pm.response.code === 200) {
          pm.collectionVariables.set('laundry_order_version', body.version);
      }
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23100
