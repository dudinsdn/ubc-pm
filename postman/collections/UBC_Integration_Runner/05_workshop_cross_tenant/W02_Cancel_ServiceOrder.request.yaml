$kind: http-request
name: Cancel ServiceOrder
url: "{{base_url}}/service-orders/{{service_order_cancel_id}}/cancel"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{service_order_cancel_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Cancel ServiceOrder -> 200 OK, status cancelled', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.collectionVariables.set('service_order_cancel_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23410
