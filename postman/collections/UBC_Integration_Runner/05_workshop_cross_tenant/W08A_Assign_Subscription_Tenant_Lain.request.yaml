$kind: http-request
name: W08A Assign Subscription Tenant Lain
url: "{{base_url}}/platform/tenants/{{other_tenant_id}}/subscription"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plan_code": "starter",
      "expected_version": null
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Starter subscription aktif untuk Tenant lain', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('other_tenant_id'));
        pm.expect(body.plan_code).to.equal('starter');
        pm.expect(body.status).to.equal('active');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23465
