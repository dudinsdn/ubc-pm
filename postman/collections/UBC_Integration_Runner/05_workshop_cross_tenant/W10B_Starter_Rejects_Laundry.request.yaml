$kind: http-request
name: W10B Starter Rejects Laundry
url: "{{base_url}}/businesses/{{other_business_id}}/laundry-orders"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_other_tenant}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Starter plan tidak memiliki capability Laundry', () => {
          pm.expect(pm.response.code).to.equal(403);
          pm.expect(body.error_code).to.equal('capability_not_entitled');
      });
    language: text/javascript
order: 23484
