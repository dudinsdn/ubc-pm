$kind: http-request
name: W10 Setup Create Transaction milik Business Lain
url: "{{base_url}}/businesses/{{other_business_id}}/transactions"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_other_tenant}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "kind": "service",
      "amount": 75000
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Transaction lintas Tenant dibuat sebagai fixture terverifikasi', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.business_id).to.equal(pm.collectionVariables.get('other_business_id'));
          pm.expect(body.amount).to.equal(75000);
      });
      pm.collectionVariables.set('other_transaction_id', body.id);
      pm.collectionVariables.set('other_transaction_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23480
