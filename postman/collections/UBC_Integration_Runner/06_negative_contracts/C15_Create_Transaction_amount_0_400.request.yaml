$kind: http-request
name: Create Transaction - amount 0 -> 400
url: "{{base_url}}/businesses/{{business_id}}/transactions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "kind": "sale",
      "amount": 0
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('400 Bad Request (amount harus > 0)', () => {
          pm.expect(pm.response.code).to.equal(400);
          pm.expect(body.error).to.include('lebih besar dari nol');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33210
