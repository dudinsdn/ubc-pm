$kind: http-request
name: CP00 Cross Tenant Cannot Link Customer Identity
url: "{{base_url}}/businesses/{{business_id}}/customers/{{customer_id}}/portal-identity"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_other_tenant}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "user_id": "{{auth_user_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Cross-tenant identity link disembunyikan sebagai 404', () => {
          pm.expect(pm.response.code).to.equal(404);
          pm.expect(body.error_code).to.equal('tenant_mismatch');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33326
