$kind: http-request
name: CPI01 Reject Duplicate Pending Invitation
url: "{{base_url}}/businesses/{{business_id}}/customers/{{customer_id}}/portal-invitations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "duplicate-invite-{{$guid}}@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Satu Customer hanya mempunyai satu invitation pending', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error_code).to.equal('portal_invitation_already_pending');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33322
