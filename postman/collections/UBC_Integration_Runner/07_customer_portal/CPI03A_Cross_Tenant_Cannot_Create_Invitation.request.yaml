$kind: http-request
name: CPI03A Cross Tenant Cannot Create Invitation
url: "{{base_url}}/businesses/{{business_id}}/customers/{{customer_id}}/portal-invitations"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_other_tenant}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "cross-tenant-{{$guid}}@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Cross-tenant invitation disembunyikan sebagai 404', () => {
          pm.expect(pm.response.code).to.equal(404);
          pm.expect(body.error_code).to.equal('tenant_mismatch');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33325
