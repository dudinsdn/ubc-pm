$kind: http-request
name: CPI06 Reject Invitation Replay
url: "{{base_url}}/customer-portal/invitations/claim"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{portal_invitation_claim_token}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Invitation bersifat single-use', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error_code).to.equal('portal_invitation_already_claimed');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33334
