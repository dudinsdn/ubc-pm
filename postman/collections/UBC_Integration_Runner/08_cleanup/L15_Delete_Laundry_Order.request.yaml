$kind: http-request
name: L15 Delete Completed Laundry Order
url: "{{base_url}}/laundry-orders/{{laundry_order_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{laundry_order_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Delete completed Laundry Order -> 204', () => {
          pm.expect(pm.response.code).to.equal(204);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33900
