$kind: http-request
name: Register Tenant A + Owner User
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_name": "Tenant A for Membership A",
        "email": "{{email}}",
        "password": "password123",
        "full_name": "User A"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant A and Owner user registered successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('tenant_a_id', body.tenant.id);
      pm.collectionVariables.set('tenant_a_version', body.tenant.version);
      pm.collectionVariables.set('user_id', body.user.id);
      pm.collectionVariables.set('user_version', body.user.version);
      pm.collectionVariables.set('membership_a_id', body.membership.id);
      pm.collectionVariables.set('membership_a_version', body.membership.version);
    language: text/javascript
  - type: beforeRequest
    code: |-
      const random = Math.random().toString(36).substring(2, 10);
      pm.collectionVariables.set("email", `user_${random}@ubc.xyz`);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4291849531424813
