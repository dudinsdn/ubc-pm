$kind: http-request
name: Login Owner Tenant A
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{tenant_a_id}}",
      "email": "{{email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Login Owner Tenant A berhasil', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.user_id).to.equal(pm.collectionVariables.get('user_id'));
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('tenant_a_id'));
          pm.expect(body.role).to.equal('owner');
      });
      pm.collectionVariables.set('token', body.token);
    language: text/javascript
order: 4370000000000000
