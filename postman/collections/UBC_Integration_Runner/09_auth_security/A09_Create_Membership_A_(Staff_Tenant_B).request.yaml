$kind: http-request
name: A09 Create Membership A (Staff Tenant B)
url: "{{base_url}}/users/{{user_id}}/memberships"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_b}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_id": "{{tenant_b_id}}",
        "role": "staff"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Membership Staff created successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
      });
      pm.collectionVariables.set('membership_b_id', body.id);
      pm.collectionVariables.set('membership_b_version', body.version);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503560000000000
