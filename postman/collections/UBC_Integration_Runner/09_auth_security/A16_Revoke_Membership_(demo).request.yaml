    code: |-
      pm.test('Revoke Membership -> 204 No Content', () => {
          pm.expect(pm.response.code).to.equal(204);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
