$kind: http-request
name: S05 Missing Business Token
url: "{{base_url}}/tenants"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Business perimeter menolak token yang hilang', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('missing_token');
      });
    language: text/javascript
order: 4504000000000000
