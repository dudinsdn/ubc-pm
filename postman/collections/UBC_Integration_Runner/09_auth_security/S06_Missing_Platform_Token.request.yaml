$kind: http-request
name: S06 Missing Platform Token
url: "{{base_url}}/platform/subscription-plans"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform perimeter menolak token yang hilang', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('platform_token_missing');
      });
    language: text/javascript
order: 4504001000000000
