$kind: http-request
name: Security Rate Limit Login (21 Iterasi)
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "00000000-0000-4000-8000-000000000001",
      "email": "rate-limit-probe@invalid.local",
      "password": "invalid-password"
    }
scripts:
  - type: afterResponse
    code: |-
      const expected = pm.info.iteration < 20 ? 401 : 429;
      pm.test('Rate limit login sesuai iterasi runner', () => {
          pm.expect(pm.response.code).to.equal(expected);
      });
      if (pm.info.iteration >= 20) {
          const body = pm.response.json();
          pm.expect(body.error_code).to.equal('rate_limit_exceeded');
          pm.expect(pm.response.headers.get('Retry-After')).to.equal('60');
      }
    language: text/javascript
order: 4503999000000000
