$kind: http-request
name: F11 Reactivate Subscription Tenant B
url: "{{base_url}}/platform/tenants/{{tenant_b_id}}/subscription"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "plan_code": "starter", "expected_version": {{tenant_b_subscription_version}} }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Subscription Tenant B dapat diaktifkan kembali untuk cleanup', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.status).to.equal('active');
      });
      pm.collectionVariables.set('tenant_b_subscription_version', body.version);
    language: text/javascript
order: 4504111000000000
