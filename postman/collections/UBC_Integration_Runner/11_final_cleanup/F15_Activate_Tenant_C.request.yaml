$kind: http-request
name: F15 Activate Tenant C
url: "{{base_url}}/platform/tenants/{{tenant_c_id}}/status"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    { "status": "active", "expected_version": {{tenant_c_version}} }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant C diaktifkan untuk cleanup terautentikasi', () => {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.collectionVariables.set('tenant_c_version', body.version);
    language: text/javascript
order: 4504115000000000
