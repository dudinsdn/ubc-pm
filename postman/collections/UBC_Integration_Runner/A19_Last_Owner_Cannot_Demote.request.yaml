$kind: http-request
name: Owner Terakhir Tidak Dapat Didemote
url: "{{base_url}}/memberships/{{membership_a_id}}/role"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "staff",
      "expected_version": 0
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner terakhir tidak dapat didemote', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error_code).to.equal('last_owner_required');
      });
    language: text/javascript
order: 4503583000000000
