$kind: http-request
name: Register Same IDs Different User Payload -> 409
url: "{{base_url}}/register"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "tenant_id": "{{tenant_id}}",
        "tenant_name": "UBC End-to-End Tenant",
        "user_id": "{{auth_user_id}}",
        "email": "{{auth_email}}",
        "password": "password456",
        "full_name": "Workshop Collection Owner",
        "membership_id": "{{auth_membership_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('409 Conflict when user replay payload differs', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error_code).to.equal('registration_user_payload_conflict');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2800
