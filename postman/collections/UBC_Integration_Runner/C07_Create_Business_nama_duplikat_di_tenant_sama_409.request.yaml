$kind: http-request
name: Create Business - nama duplikat di tenant sama -> 409
url: "{{base_url}}/tenants/{{tenant_id}}/businesses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Bengkel UBC End-to-End Updated",
      "business_type": "workshop"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('409 Conflict (nama business duplikat)', () => {
          pm.expect(pm.response.code).to.equal(409);
          pm.expect(body.error).to.include('nama business');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33130
