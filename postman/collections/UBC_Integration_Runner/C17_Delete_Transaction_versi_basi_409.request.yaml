$kind: http-request
name: Delete Transaction - versi basi -> 409
url: "{{base_url}}/transactions/{{transaction_id}}"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{err_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict (version mismatch)', () => {
          pm.expect(pm.response.code).to.equal(409);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 33230
