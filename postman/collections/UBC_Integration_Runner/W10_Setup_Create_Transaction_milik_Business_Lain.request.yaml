$kind: http-request
name: W10 Setup Create Transaction milik Business Lain
url: "{{base_url}}/businesses/{{other_business_id}}/transactions"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{token_other_tenant}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "kind": "service",
      "amount": 75000
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('other_transaction_id', body.id);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 23480
