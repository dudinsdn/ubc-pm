$kind: http-request
name: Readiness
url: "{{base_url}}/readyz"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Readiness reflects database availability', () => {
          pm.expect(pm.response.code).to.be.oneOf([200, 503]);
          if (pm.response.code === 200) {
              pm.expect(body).to.eql({ status: 'ready' });
          } else {
              pm.expect(body).to.eql({ status: 'not_ready', error_code: 'database_unavailable' });
          }
          pm.expect(pm.response.headers.get('x-request-id')).to.be.a('string').and.not.empty;
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 2000
