$kind: http-request
name: 02 Login Pending Tenant
url: "{{base_url}}/auth/login"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{platform_tenant_id}}",
      "email": "{{platform_owner_email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner Tenant pending dapat login', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.user_id).to.equal(pm.collectionVariables.get('platform_owner_user_id'));
        pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('platform_tenant_id'));
        pm.expect(body.token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('platform_tenant_token', body.token);
    language: text/javascript
order: 2000
