$kind: http-request
name: 03 List Tenants
url: "{{base_url}}/platform/tenants"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform Admin melihat Tenant pending', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body).to.be.an('array');
        const tenant = body.find(item => item.id === pm.collectionVariables.get('platform_tenant_id'));
        pm.expect(tenant).to.be.an('object');
        pm.expect(tenant.status).to.equal('pending');
      });
    language: text/javascript
order: 3000
