$kind: http-request
name: 04A Assign Professional Subscription
url: "{{base_url}}/platform/tenants/{{platform_tenant_id}}/subscription"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plan_code": "professional",
      "expected_version": null
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Professional subscription aktif sebelum aktivasi Tenant', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('platform_tenant_id'));
        pm.expect(body.plan_code).to.equal('professional');
        pm.expect(body.status).to.equal('active');
      });
      pm.collectionVariables.set('platform_subscription_version', body.version);
    language: text/javascript
order: 4500
