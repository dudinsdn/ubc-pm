$kind: http-request
name: 05 Activate Tenant
url: "{{base_url}}/platform/tenants/{{platform_tenant_id}}/status"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "active",
      "expected_version": {{platform_tenant_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform Admin mengaktifkan Tenant', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.status).to.equal('active');
      });
      pm.collectionVariables.set('platform_tenant_version', body.version);
    language: text/javascript
order: 5000
