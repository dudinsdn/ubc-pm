$kind: http-request
name: Audit Missing Token
url: "{{base_url}}/platform/audit-events"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Audit rejects missing Platform JWT', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('platform_token_missing');
      });
    language: text/javascript
order: 5000
