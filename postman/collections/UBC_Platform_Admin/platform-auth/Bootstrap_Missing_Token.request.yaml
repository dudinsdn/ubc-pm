$kind: http-request
name: Bootstrap Missing Token
url: "{{base_url}}/platform/bootstrap/operator"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email":"negative-platform@example.com","password":"password123","full_name":"Negative Operator"}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Bootstrap rejects missing bootstrap token', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('platform_invalid_credentials');
      });
    language: text/javascript
order: 1000
