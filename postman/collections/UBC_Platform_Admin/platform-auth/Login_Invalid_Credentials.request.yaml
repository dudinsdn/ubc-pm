$kind: http-request
name: Platform Login Invalid Credentials
url: "{{base_url}}/platform/auth/login"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email":"missing-platform@example.com","password":"wrong-password"}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Invalid Platform credentials return 401', () => {
          pm.expect(pm.response.code).to.equal(401);
          pm.expect(body.error_code).to.equal('platform_invalid_credentials');
      });
    language: text/javascript
order: 2000
