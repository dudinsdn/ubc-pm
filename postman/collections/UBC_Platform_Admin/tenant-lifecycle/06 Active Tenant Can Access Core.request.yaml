$kind: http-request
name: 06 Active Tenant Can Access Core
url: "{{base_url}}/tenants/{{platform_tenant_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{platform_tenant_token}}"
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Tenant aktif dapat mengakses Core', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.id).to.equal(pm.collectionVariables.get('platform_tenant_id'));
      });
    language: text/javascript
order: 6000
