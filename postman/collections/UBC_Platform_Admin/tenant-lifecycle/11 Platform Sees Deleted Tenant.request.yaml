$kind: http-request
name: 11 Platform Sees Deleted Tenant
url: "{{base_url}}/platform/tenants/{{platform_tenant_id}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform Admin tetap dapat melihat Tenant terhapus', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.id).to.equal(pm.collectionVariables.get('platform_tenant_id'));
        pm.expect(body.is_deleted).to.equal(true);
      });
    language: text/javascript
order: 11000
