$kind: http-request
name: 00 Bootstrap Platform Operator
url: "{{base_url}}/platform/bootstrap/operator"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{platform_admin_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{platform_operator_email}}",
      "password": "{{platform_operator_password}}",
      "full_name": "UBC N2N Platform Operator"
    }
scripts:
  - type: beforeRequest
    code: |-
      const suffix = Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      pm.collectionVariables.set('owner_email', 'n2n_owner_' + suffix + '@example.com');
      pm.collectionVariables.set('portal_email', 'n2n_customer_' + suffix + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Platform operator siap', () => {
        pm.expect(pm.response.code).to.be.oneOf([201, 409]);
        if (pm.response.code === 409) {
          pm.expect(body.error_code).to.equal('platform_operator_already_bootstrapped');
        }
      });
    language: text/javascript
order: 100
