$kind: http-request
name: 04 Assign Subscription
url: "{{base_url}}/platform/tenants/{{tenant_id}}/subscription"
method: PUT
auth:
  type: bearer
  credentials:
    token: "{{platform_access_token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "plan_code": "starter"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Subscription aktif diberikan', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.status).to.equal('active');
      });
    language: text/javascript
order: 500

