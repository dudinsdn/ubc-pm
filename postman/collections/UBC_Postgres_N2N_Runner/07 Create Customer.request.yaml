$kind: http-request
name: 07 Create Customer
url: "{{base_url}}/businesses/{{business_id}}/customers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "UBC N2N Customer",
      "phone": "+628123456789"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Customer dibuat', () => {
        pm.expect(pm.response.code).to.equal(201);
        pm.expect(body.business_id).to.equal(pm.collectionVariables.get('business_id'));
      });
      pm.collectionVariables.set('customer_id', body.id);
    language: text/javascript
order: 800

