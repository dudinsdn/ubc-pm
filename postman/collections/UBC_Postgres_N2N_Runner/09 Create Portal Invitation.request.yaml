$kind: http-request
name: 09 Create Portal Invitation
url: "{{base_url}}/businesses/{{business_id}}/customers/{{customer_id}}/portal-invitations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{portal_email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner membuat invitation portal', () => {
        pm.expect(pm.response.code).to.equal(201);
        pm.expect(body.status).to.equal('pending');
        pm.expect(body.claim_token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('invitation_id', body.id);
      pm.collectionVariables.set('invitation_claim_token', body.claim_token);
    language: text/javascript
order: 1000

