$kind: http-request
name: 10 Claim Portal Invitation
url: "{{base_url}}/customer-portal/invitations/claim"
method: POST
auth:
  type: noauth
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{invitation_claim_token}}",
      "password": "password123",
      "full_name": "UBC N2N Customer"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Invitation diklaim dan JWT portal diterbitkan', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body.token).to.be.a('string').and.not.empty;
      });
      pm.collectionVariables.set('portal_access_token', body.token);
    language: text/javascript
order: 1100

