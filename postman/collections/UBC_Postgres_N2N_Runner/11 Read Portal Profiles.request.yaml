$kind: http-request
name: 11 Read Portal Profiles
url: "{{base_url}}/customer-portal/profiles"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{portal_access_token}}"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Customer membaca profile tertaut', () => {
        pm.expect(pm.response.code).to.equal(200);
        pm.expect(body).to.be.an('array').with.lengthOf(1);
        pm.expect(body[0].customer_id).to.equal(pm.collectionVariables.get('customer_id'));
      });
    language: text/javascript
order: 1200

