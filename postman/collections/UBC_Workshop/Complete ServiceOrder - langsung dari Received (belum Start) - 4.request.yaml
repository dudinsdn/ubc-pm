$kind: http-request
name: Complete ServiceOrder - langsung dari Received (belum Start) -> 409
url: "{{base_url}}/service-orders/{{service_order_err_id}}/complete"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": {{service_order_err_version}}
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('409 Conflict (transisi status tidak valid)', () => {
          pm.expect(pm.response.code).to.equal(409);
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503596963948271
