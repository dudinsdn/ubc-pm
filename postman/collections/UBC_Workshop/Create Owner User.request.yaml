$kind: http-request
name: Create Owner User
url: "{{base_url}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{auth_email}}",
      "password": "password123",
      "full_name": "Workshop Collection Owner"
    }
scripts:
  - type: beforeRequest
    code: |-
      const random = Math.random().toString(36).substring(2, 10);
      pm.collectionVariables.set('auth_email', `workshop_owner_${random}@ubc.xyz`);
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Workshop Owner user created successfully', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.email).to.equal(pm.collectionVariables.get('auth_email'));
          pm.expect(body.is_deleted).to.equal(false);
      });
      pm.collectionVariables.set('auth_user_id', body.id);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4200000000000000
