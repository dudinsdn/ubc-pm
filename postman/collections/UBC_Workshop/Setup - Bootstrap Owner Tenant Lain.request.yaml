$kind: http-request
name: Setup - Bootstrap Owner Tenant Lain
url: "{{base_url}}/users/{{auth_user_id}}/memberships/bootstrap-owner"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{other_tenant_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('Owner Tenant lain berhasil dibuat', () => {
          pm.expect(pm.response.code).to.equal(201);
          pm.expect(body.user_id).to.equal(pm.collectionVariables.get('auth_user_id'));
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('other_tenant_id'));
          pm.expect(body.role).to.equal('owner');
      });
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503599000000000
