$kind: http-request
name: Setup - Login Tenant Lain
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenant_id": "{{other_tenant_id}}",
      "email": "{{auth_email}}",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('JWT Tenant lain berhasil dibuat', () => {
          pm.expect(pm.response.code).to.equal(200);
          pm.expect(body.tenant_id).to.equal(pm.collectionVariables.get('other_tenant_id'));
          pm.expect(body.role).to.equal('owner');
      });
      pm.collectionVariables.set('token_other_tenant', body.token);
    language: text/javascript
settings:
  followRedirects: true
  disableUrlEncoding: false
  disableCookies: false
order: 4503599100000000
